backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "ar"

collections:
  - name: "site"
    label: "محتوى الموقع"
    files:

      - name: "company"
        label: "بيانات الشركة والصفحة الرئيسية (الهاتف / واتساب / العنوان)"
        file: "content/company.json"
        fields:
          - { label: "رقم الهاتف (بصيغة دولية مثل +966504158234)", name: "phone", widget: "string" }
          - { label: "الرقم كما يظهر للزوار (مثل 0504158234)", name: "phone_display", widget: "string", required: false }
          - { label: "رقم واتساب (بدون + وبدون مسافات)", name: "whatsapp", widget: "string" }
          - { label: "عنوان الصفحة الرئيسية", name: "hero_title", widget: "string", required: false }
          - { label: "وصف الصفحة الرئيسية", name: "hero_text", widget: "text", required: false }
          - { label: "نص أسفل كل الصفحات", name: "footer_text", widget: "string", required: false }
          - label: "أرقام إضافية (اتصال / واتساب) تظهر في صفحة اتصل بنا"
            name: "extra_contacts"
            widget: "list"
            required: false
            summary: "{{fields.label}} - {{fields.number}}"
            fields:
              - { label: "الاسم (مثل: المبيعات)", name: "label", widget: "string" }
              - { label: "الرقم (مثل +966501234567)", name: "number", widget: "string" }
              - label: "النوع"
                name: "type"
                widget: "select"
                default: "both"
                options:
                  - { label: "اتصال وواتساب", value: "both" }
                  - { label: "اتصال فقط", value: "call" }
                  - { label: "واتساب فقط", value: "wa" }

      - name: "home"
        label: "الصفحة الرئيسية (المميزات / الخطوات / المناطق / الصور)"
        file: "content/home.json"
        fields:
          - { label: "عنوان قسم المميزات", name: "features_title", widget: "string", required: false }
          - label: "المميزات"
            name: "features"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "الأيقونة"
                name: "icon"
                widget: "select"
                default: "fa-star"
                options:
                  - { label: "شاحنة شفط", value: "fa-truck-monster" }
                  - { label: "شاحنة", value: "fa-truck-fast" }
                  - { label: "ساعة / سرعة", value: "fa-clock" }
                  - { label: "أسعار", value: "fa-tags" }
                  - { label: "مياه / مجاري", value: "fa-water" }
                  - { label: "موقع", value: "fa-location-dot" }
                  - { label: "اتصال", value: "fa-phone-volume" }
                  - { label: "حماية / ضمان", value: "fa-shield-halved" }
                  - { label: "نجمة / جودة", value: "fa-star" }
                  - { label: "علامة صح", value: "fa-circle-check" }
                  - { label: "دعم", value: "fa-headset" }
                  - { label: "أدوات", value: "fa-screwdriver-wrench" }
                  - { label: "اتفاق", value: "fa-handshake" }
                  - { label: "تنظيف", value: "fa-broom" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "النص", name: "text", widget: "text" }
          - { label: "عنوان قسم الخطوات", name: "steps_title", widget: "string", required: false }
          - label: "خطوات طلب الخدمة"
            name: "steps"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "الأيقونة"
                name: "icon"
                widget: "select"
                default: "fa-circle-check"
                options:
                  - { label: "شاحنة شفط", value: "fa-truck-monster" }
                  - { label: "شاحنة", value: "fa-truck-fast" }
